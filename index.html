<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qalta</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:#1a1a1a; background:#faf9f7; }
  .card { max-width:460px; padding:40px 26px; text-align:center; }
  .logo { width:88px; height:88px; border-radius:22px; margin:0 auto 20px;
          background:linear-gradient(160deg,#2a2a2e,#0d0d0f); color:#fff;
          display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:600; }
  h1 { font-size:1.7rem; margin:0 0 8px; }
  p { color:#555; margin:0 0 26px; }
  .links { display:flex; flex-direction:column; gap:10px; }
  .links a { display:block; padding:14px; border:1px solid #d9d7d2; border-radius:12px;
             text-decoration:none; color:#1a1a1a; font-weight:500; }
  @media (prefers-color-scheme: dark) {
    body { background:#111214; color:#e8e8ea; }
    p { color:#b5b5b8; }
    .links a { border-color:#2f3033; color:#e8e8ea; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">₸</div>
    <h1>Qalta</h1>
    <p>Простое приложение для учёта личных финансов в тенге.</p>
    <div class="links">
      <a href="privacy.html">Политика конфиденциальности</a>
      <a href="support.html">Поддержка</a>
    </div>
  </div>
</body>
</html>
